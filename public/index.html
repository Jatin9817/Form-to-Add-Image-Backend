<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Media</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Roboto, Arial, sans-serif; }
        body { background-color: #0f0f0f; color: #f1f1f1; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .form-container { background-color: #212121; padding: 32px; border-radius: 16px; width: 100%; max-width: 450px; border: 1px solid #3f3f3f; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .form-title { font-size: 20px; font-weight: bold; margin-bottom: 24px; color: #fff; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #aaa; }
        input[type="text"], input[type="email"], textarea, input[type="file"] { width: 100%; padding: 10px 14px; background-color: #121212; border: 1px solid #3f3f3f; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        input:focus, textarea:focus { border-color: #3ea6ff; }
        textarea { resize: vertical; height: 100px; }
        input[type="file"] { padding: 8px; cursor: pointer; }
        button[type="submit"] { width: 100%; background-color: #3ea6ff; color: #0f0f0f; font-weight: bold; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; margin-top: 10px; transition: background 0.2s; }
        button[type="submit"]:hover { background-color: #65b8ff; }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="form-title">Upload Media</div>
        <form action="/contact" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label>Title / Name:</label>
                <input type="text" name="name" required placeholder="Enter title">
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" name="email" required placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Description / Message:</label>
                <textarea name="message" placeholder="Enter description..."></textarea>
            </div>
            <div class="form-group">
                <label>Upload Image:</label>
                <input type="file" name="userImage" accept="image/*" required>
            </div>
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
